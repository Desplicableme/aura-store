# =============================================================================
# Hyprland Window Rules for Aura Package Hub
# =============================================================================
# To use this in your Hyprland configuration, add this line to your hyprland.conf:
#   source = ~/.local/share/aura/data/hyprland-aura.conf
# Or copy these rules directly into ~/.config/hypr/hyprland.conf:

# Float Aura by default in an optimal 1040x680 window
windowrulev2 = float, class:^(io.github.aura)$
windowrulev2 = center, class:^(io.github.aura)$
windowrulev2 = size 1040 680, class:^(io.github.aura)$

# Prevent Hyprland background layer blur conflict (uses Aura's native glassmorphism)
windowrulev2 = opaque, class:^(io.github.aura)$

# Optional: Add a keybinding in your hyprland.conf to toggle Aura instantly:
# bind = $mainMod, A, exec, aura

