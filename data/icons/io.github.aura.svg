<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Deep Sapphire / Midnight Glass Gradient -->
    <linearGradient id="auraDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c2e"/>
      <stop offset="50%" stop-color="#121524"/>
      <stop offset="100%" stop-color="#0d0f18"/>
    </linearGradient>

    <!-- Ambient Blue & Purple Radial Glows -->
    <radialGradient id="ambientBlueGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientPurpleGlow" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Highlight for Glass Rim Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Top Facet: Luminous ice-white & cyan glass (#ffffff -> #bae6fd -> #38bdf8) -->
    <linearGradient id="topFacet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Left Facet: Vibrant Apple Royal Blue (#38bdf8 -> #2563eb -> #1d4ed8) -->
    <linearGradient id="leftFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Facet: Radiant Neon Violet / Magenta (#f472b6 -> #c084fc -> #7c3aed) -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="48%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Inner Arch Peak Gradient -->
    <linearGradient id="archGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Core Star Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Emblem Drop Shadow -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Squircle Base Fills the Icon -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#auraDarkBg)"/>

  <!-- Clipped Interior with Ambient Lighting & Emblem -->
  <g clip-path="url(#squircleClip)">
    <!-- Ambient Radial Glows -->
    <circle cx="170" cy="160" r="230" fill="url(#ambientBlueGlow)"/>
    <circle cx="342" cy="330" r="220" fill="url(#ambientPurpleGlow)"/>

    <!-- Subtle Diagonal Glass Sheen Line -->
    <path d="M 0,0 L 512,512" stroke="url(#glassBorder)" stroke-width="1.5" opacity="0.12"/>

    <!-- Central Brand Emblem (Perfectly Centered at 256, 256) -->
    <g filter="url(#emblemShadow)">
      <!-- Left Facet: Vibrant Apple Royal Blue -->
      <path d="M 256,256 L 105,168 L 105,344 L 256,431 Z" 
            fill="url(#leftFacet)"/>

      <!-- Right Facet: Radiant Neon Violet / Magenta -->
      <path d="M 256,256 L 407,168 L 407,344 L 256,431 Z" 
            fill="url(#rightFacet)"/>

      <!-- Top Facet: Luminous ice-white & cyan glass -->
      <path d="M 256,81 L 407,168 L 256,256 L 105,168 Z" 
            fill="url(#topFacet)"/>
    </g>

    <!-- Specular Facet Edge Highlights for 3D Glass Precision -->
    <path d="M 256,81 L 407,168 L 407,344 L 256,431 L 105,344 L 105,168 Z" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 105,168 L 256,81 L 407,168" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <line x1="256" y1="256" x2="256" y2="431" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="256" y1="256" x2="105" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="256" y1="256" x2="407" y2="168" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

    <!-- Inner Arch Peak: Pure glowing white accent -->
    <path d="M 256,115 L 306,215 Q 256,185 206,215 Z" 
          fill="url(#archGrad)" filter="url(#softGlow)"/>

    <!-- Central Star Spark at (256, 256) -->
    <path d="M 256,230 Q 256,256 282,256 Q 256,256 256,282 Q 256,256 230,256 Q 256,256 256,230 Z" 
          fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="256" cy="256" r="6" fill="#ffffff" filter="url(#coreGlow)"/>
    <circle cx="256" cy="256" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Glass Rim Highlight -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" ry="113.5" 
        fill="none" stroke="url(#glassBorder)" stroke-width="3"/>
</svg>
