<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS Squircle Clip Path -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>

    <!-- Canonical Brand Gradient: deep aubergine/cherry to luminous orange -->
    <linearGradient id="snapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77216F"/>
      <stop offset="50%" stop-color="#5E2750"/>
      <stop offset="100%" stop-color="#E95420"/>
    </linearGradient>

    <!-- Ambient Subtle Top-Left Glass Sheen -->
    <radialGradient id="snapGlassSheen" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Highlight for Glass Rim Border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Upper/Left Facet: Warm Orange -->
    <linearGradient id="facetUpperLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F3C"/>
      <stop offset="100%" stop-color="#E95420"/>
    </linearGradient>

    <!-- Right/Wing Facet: Radiant Gold / Tangerine -->
    <linearGradient id="facetRightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE3B"/>
      <stop offset="100%" stop-color="#F99B11"/>
    </linearGradient>

    <!-- Lower Facet: Deep Magenta / Aubergine -->
    <linearGradient id="facetLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E2A84"/>
      <stop offset="50%" stop-color="#77216F"/>
      <stop offset="100%" stop-color="#531446"/>
    </linearGradient>

    <!-- Center Highlight: Crisp Frosted White / Rose Accent -->
    <linearGradient id="facetCenter" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FAD0E0"/>
    </linearGradient>

    <!-- Emblem Soft Depth Shadow -->
    <filter id="emblemShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2a0020" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#snapBg)"/>

  <!-- Clipped Interior with Ambient Lighting & Emblem -->
  <g clip-path="url(#squircleClip)">
    <!-- Ambient Radial Lighting -->
    <circle cx="140" cy="120" r="280" fill="url(#snapGlassSheen)"/>

    <!-- Subtle Diagonal Glass Sheen Line -->
    <path d="M 0,0 L 512,512" stroke="url(#glassBorder)" stroke-width="1.5" opacity="0.10"/>

    <!-- Canonical Snapcraft Origami Emblem Centered at (256, 256) -->
    <g transform="translate(37.975, 73.289) scale(3.41198)" filter="url(#emblemShadow)">
      <!-- 1. Upper/Left Facet: Warm Orange -->
      <path d="m70.13 23.1l-61.26-22.14 61.26 60.88v-38.74z" 
            fill="url(#facetUpperLeft)"/>

      <!-- 2. Right/Wing Facet: Radiant Gold / Tangerine -->
      <path d="m118.94 43.26l-10.04-20.16h-35.3l45.34 20.16z" 
            fill="url(#facetRightWing)"/>

      <!-- 3. Lower Facet: Deep Magenta / Aubergine -->
      <path d="m55.61 50.33l-29.76 55.8 42.82-42.83-13.06-12.97z" 
            fill="url(#facetLower)"/>

      <!-- 4. Center Highlight: Crisp Frosted White / Rose Accent -->
      <path d="m72.2 24.74v35.05l24.28-24.27-24.28-10.78z" 
            fill="url(#facetCenter)"/>

      <!-- Specular Facet Crease Highlights -->
      <path d="m70.13 23.1l-61.26-22.14 61.26 60.88" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
      <line x1="70.13" y1="23.1" x2="70.13" y2="61.84" stroke="rgba(255,255,255,0.7)" stroke-width="0.6"/>
      <line x1="73.6" y1="23.1" x2="108.9" y2="23.1" stroke="rgba(255,255,255,0.6)" stroke-width="0.6"/>
      <line x1="72.2" y1="24.74" x2="72.2" y2="59.79" stroke="#ffffff" stroke-width="0.8" opacity="0.8"/>
      <path d="m55.61 50.33l-29.76 55.8" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" fill="none"/>
    </g>
  </g>

  <!-- Specular Glass Border Highlight -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" ry="113.5" 
        fill="none" stroke="url(#glassBorder)" stroke-width="3"/>
</svg>
